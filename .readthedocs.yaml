version: 2

build:
  os: ubuntu-lts-latest
  tools:
    python: "3.13"
  apt_packages:
    - nix-bin
  jobs:
    install:
      - nix --version
    build:
      html:
        - nix --extra-experimental-features 'nix-command flakes' build '^doc' -L --option sandbox-fallback false
        # Copy inside Nix so user-owned store paths resolve.
        - |
          nix --extra-experimental-features 'nix-command flakes' shell '.#default^doc' --command sh -eu -c '
            mkdir -p "$READTHEDOCS_OUTPUT/html"
            cp -R result-doc/share/doc/*/html/. "$READTHEDOCS_OUTPUT/html/"
          '
