version: 2

# RTD's non-root container does not support normal Nix operation;
# use `proot` to map `/nix` to a local user directory.
build:
  os: ubuntu-lts-latest
  tools:
    python: "3.13"
  apt_packages: [nix-bin, build-essential, pkg-config, libtalloc-dev] # see build-proot.sh
  jobs:
    install:
      - ./docs/build-proot.sh
      - ./docs/configure-nix.sh
    build:
      html:
        - mkdir -p "$READTHEDOCS_OUTPUT/html"
        - ~/proot-env nix build "^doc" -L
        - ~/proot-env sh -eu -c "cp -R result-doc/share/doc/*/html/. \"\$READTHEDOCS_OUTPUT/html/\""
